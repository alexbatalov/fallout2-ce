name: Release

on:
  release:
    types:
      - published

defaults:
  run:
    shell: bash

jobs:
  linux-x64:
    name: Linux (x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev zlib1g-dev
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFALLOUT_VENDORED=OFF
          cmake --build build -j$(nproc)
      - name: Upload
        run: |
          cd build
          tar -czvf fallout2-ce-linux-x64.tar.gz fallout2-ce
          gh release upload ${{ github.event.release.tag_name }} fallout2-ce-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-x86:
    name: Linux (x86)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y g++-multilib libsdl2-dev:i386 zlib1g-dev:i386
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFALLOUT_VENDORED=OFF \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain/Linux32.cmake
          cmake --build build -j$(nproc)
      - name: Upload
        run: |
          cd build
          tar -czvf fallout2-ce-linux-x86.tar.gz fallout2-ce
          gh release upload ${{ github.event.release.tag_name }} fallout2-ce-linux-x86.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -G Xcode -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=''
          cmake --build build --config RelWithDebInfo -j$(sysctl -n hw.logicalcpu)
      - name: Pack + Upload
        run: |
          cd build
          cpack -C RelWithDebInfo
          cp "Fallout II Community Edition.dmg" fallout2-ce-macos.dmg
          gh release upload ${{ github.event.release.tag_name }} fallout2-ce-macos.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-x64:
    name: Windows (x64)
    runs-on: windows-2019
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -G "Visual Studio 16 2019" -A x64
          cmake --build build --config RelWithDebInfo
      - name: Upload
        run: |
          cd build/RelWithDebInfo
          7z a fallout2-ce-windows-x64.zip fallout2-ce.exe
          gh release upload ${{ github.event.release.tag_name }} fallout2-ce-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-x86:
    name: Windows (x86)
    runs-on: windows-2019
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -G "Visual Studio 16 2019" -A Win32
          cmake --build build --config RelWithDebInfo
      - name: Upload
        run: |
          cd build/RelWithDebInfo
          7z a fallout2-ce-windows-x86.zip fallout2-ce.exe
          gh release upload ${{ github.event.release.tag_name }} fallout2-ce-windows-x86.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  xbox:
    name: Xbox
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Xbox ISO
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 libssl-dev clang llvm lld
          export NXDK_DIR=${{ github.workspace }}/nxdk
          git clone --recurse-submodules https://github.com/XboxDev/nxdk.git $NXDK_DIR
          cd $NXDK_DIR
          make NXDK_CXX=1 lib/libc++.lib -j$(nproc)
          make NXDK_CXX=1 NXDK_SDL=1 lib/libSDL2.lib -j$(nproc)
          mkdir -p tools/extract-xiso/build
          cd tools/extract-xiso/build
          cmake ..
          make -j$(nproc)
          cd ${{ github.workspace }}
          export PATH=$NXDK_DIR/bin:$PATH
          nxdk-cmake -B build-nxdk -S . -DNXDK_DIR=$NXDK_DIR
          cmake --build build-nxdk -j$(nproc)
      - name: Upload
        run: gh release upload "${{ github.event.release.tag_name }}" fallout2-ce.iso --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  steam-deck:
    name: Steam Deck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build + Package
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev zlib1g-dev cmake libfuse2
          cmake -B build-deck -DCMAKE_BUILD_TYPE=Release -DFALLOUT_VENDORED=OFF
          cmake --build build-deck -j$(nproc)
          wget -q -O linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build-deck/fallout2-ce          AppDir/usr/bin/fallout2-ce
          cp tools/steamdeck/f2_res.ini      AppDir/
          cp tools/steamdeck/fallout2-ce.desktop AppDir/usr/share/applications/
          cp tools/steamdeck/icon.png        AppDir/usr/share/icons/hicolor/256x256/apps/fallout2-ce.png
          APPIMAGE_EXTRACT_AND_RUN=1 OUTPUT=Fallout2-CE-SteamDeck-x86_64.AppImage \
            ./linuxdeploy.AppImage --appdir AppDir --output appimage
      - name: Upload
        run: gh release upload "${{ github.event.release.tag_name }}" Fallout2-CE-SteamDeck-x86_64.AppImage --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
