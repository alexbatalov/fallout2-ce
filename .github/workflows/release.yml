name: Release

on:
  release:
    types:
      - published

defaults:
  run:
    shell: bash

jobs:
  android:
    name: Android

    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: os/android/app/.cxx
          key: android-cmake-v1

      - name: Setup signing config
        if: env.KEYSTORE_FILE_BASE64 != '' && env.KEYSTORE_PROPERTIES_FILE_BASE64 != ''
        run: |
          cd os/android
          echo "$KEYSTORE_FILE_BASE64" | base64 --decode > release.keystore
          echo "$KEYSTORE_PROPERTIES_FILE_BASE64" | base64 --decode > release-keystore.properties
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_FILE_BASE64 }}
          KEYSTORE_PROPERTIES_FILE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PROPERTIES_FILE_BASE64 }}

      - name: Build
        run: |
          cd os/android
          ./gradlew assembleRelease

      - name: Upload
        run: |
          cd os/android/app/build/outputs/apk/release
          cp app-release.apk fallout2-ce-android.apk
          gh release upload ${{ github.event.release.tag_name }} fallout2-ce-android.apk
          rm fallout2-ce-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    name: iOS

    runs-on: macos-12

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: build
          key: ios-cmake-v1

      - name: Configure
        run: |
          cmake \
            -B build \
            -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/ios.toolchain.cmake \
            -D ENABLE_BITCODE=0 \
            -D PLATFORM=OS64 \
            -G Xcode \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY='' \
            # EOL

      - name: Build
        run: |
          cmake \
            --build build \
            --config RelWithDebInfo \
            -j $(sysctl -n hw.physicalcpu) \
            # EOL

      - name: Pack
        run: |
          cd build
          cpack -C RelWithDebInfo

      - name: Upload
        run: |
          cd build
          cp fallout2-ce.ipa fallout2-ce-ios.ipa
          gh release upload ${{ github.event.release.tag_name }} fallout2-ce-ios.ipa
          rm fallout2-ce-ios.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    name: Linux (${{ matrix.arch }})

    runs-on: ubuntu-20.04

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86
          - x64

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Dependencies (x86)
        if: matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install --allow-downgrades libpcre2-8-0=10.34-7
          sudo apt install g++-multilib libsdl2-dev:i386 zlib1g-dev:i386

      - name: Dependencies (x64)
        if: matrix.arch == 'x64'
        run: |
          sudo apt update
          sudo apt install libsdl2-dev zlib1g-dev

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: build
          key: linux-${{ matrix.arch }}-cmake-v1

      - name: Configure (x86)
        if: matrix.arch == 'x86'
        run: |
          cmake \
            -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/Linux32.cmake \
            # EOL

      - name: Configure (x64)
        if: matrix.arch == 'x64'
        run: |
          cmake \
            -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            # EOL

      - name: Build
        run: |
          cmake \
            --build build \
            -j $(nproc) \
            # EOL

      - name: Upload
        run: |
          cd build
          tar -czvf fallout2-ce-linux-${{ matrix.arch }}.tar.gz fallout2-ce
          gh release upload ${{ github.event.release.tag_name }} fallout2-ce-linux-${{ matrix.arch }}.tar.gz
          rm fallout2-ce-linux-${{ matrix.arch }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS

    runs-on: macos-11

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Import code signing certificates
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_FILE_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_PASSWORD }}

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: build
          key: macos-cmake-v3

      - name: Configure
        run: |
          cmake \
            -B build \
            -G Xcode \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="${{ secrets.APPLE_DEVELOPER_CERTIFICATE_IDENTITY }}" \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_INJECT_BASE_ENTITLEMENTS="NO" \
            -D CMAKE_XCODE_ATTRIBUTE_OTHER_CODE_SIGN_FLAGS="--options=runtime --timestamp" \
            # EOL

      - name: Build
        run: |
          cmake \
            --build build \
            --config RelWithDebInfo \
            -j $(sysctl -n hw.physicalcpu) \
            # EOL

      - name: Pack
        run: |
          cd build
          cpack -C RelWithDebInfo

      - name: Notarize
        run: |
          xcrun notarytool submit \
            "build/Fallout II Community Edition.dmg" \
            --apple-id "${{ secrets.APPLE_DEVELOPER_AC_USERNAME }}" \
            --team-id "${{ secrets.APPLE_DEVELOPER_AC_TEAM }}" \
            --password "${{ secrets.APPLE_DEVELOPER_AC_PASSWORD }}" \
            --wait

      - name: Staple
        run: |
          xcrun stapler staple \
            "build/Fallout II Community Edition.dmg"

      - name: Upload
        run: |
          cd build
          cp "Fallout II Community Edition.dmg" fallout2-ce-macos.dmg
          gh release upload ${{ github.event.release.tag_name }} fallout2-ce-macos.dmg
          rm fallout2-ce-macos.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows (${{ matrix.arch }})

    runs-on: windows-2019

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            generator-platform: Win32
          - arch: x64
            generator-platform: x64

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Cache cmake build
        uses: actions/cache@v4
        with:
          path: build
          key: windows-${{ matrix.arch }}-cmake-v1

      - name: Configure
        run: |
          cmake \
            -B build \
            -G "Visual Studio 16 2019" \
            -A ${{ matrix.generator-platform }} \
            # EOL

      - name: Build
        run: |
          cmake \
            --build build \
            --config RelWithDebInfo \
            # EOL

      - name: Upload
        run: |
          cd build/RelWithDebInfo
          7z a fallout2-ce-windows-${{ matrix.arch }}.zip fallout2-ce.exe
          gh release upload ${{ github.event.release.tag_name }} fallout2-ce-windows-${{ matrix.arch }}.zip
          rm fallout2-ce-windows-${{ matrix.arch }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  xbox:
    name: Xbox

    runs-on: ubuntu-22.04

    env:
      NXDK_DIR: ${{ github.workspace }}/nxdk

    steps:
      - name: Clone game
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 libssl-dev

      - name: Clone NXDK
        run: git clone --depth=1 https://github.com/XboxDev/nxdk.git $NXDK_DIR

      - name: Get NXDK commit hash
        id: nxdk-hash
        run: echo "sha=$(git -C $NXDK_DIR rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Cache NXDK libraries
        id: nxdk-cache
        uses: actions/cache@v4
        with:
          path: |
            nxdk/lib
            nxdk/tools/extract-xiso/build
          key: nxdk-${{ runner.os }}-${{ steps.nxdk-hash.outputs.sha }}

      - name: Build NXDK prerequisites
        if: steps.nxdk-cache.outputs.cache-hit != 'true'
        run: |
          cd $NXDK_DIR
          make NXDK_CXX=1 lib/libc++.lib -j$(nproc)
          make NXDK_CXX=1 NXDK_SDL=1 lib/libSDL2.lib -j$(nproc)
          cmake -B tools/extract-xiso/build -S tools/extract-xiso
          cmake --build tools/extract-xiso/build -j$(nproc)

      - name: Configure
        run: |
          export PATH=$NXDK_DIR/bin:$PATH
          nxdk-cmake -B build -DNXDK_DIR=$NXDK_DIR

      - name: Build
        run: |
          export PATH=$NXDK_DIR/bin:$PATH
          cmake --build build -j$(nproc)

      - name: Upload Xbox ISO to release
        run: gh release upload "${{ github.event.release.tag_name }}" fallout2-ce.iso --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  steam-deck:
    name: Steam Deck

    runs-on: ubuntu-22.04

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Install deps + build + package
        run: |
          sudo apt-get update && sudo apt-get install -y libsdl2-dev zlib1g-dev cmake libfuse2
          cmake -B build-deck -DCMAKE_BUILD_TYPE=Release
          cmake --build build-deck -j$(nproc)
          wget -q -O linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build-deck/fallout2-ce          AppDir/usr/bin/fallout2-ce
          cp tools/steamdeck/f2_res.ini      AppDir/
          cp tools/steamdeck/fallout2-ce.desktop AppDir/usr/share/applications/
          cp tools/steamdeck/icon.png        AppDir/usr/share/icons/hicolor/256x256/apps/fallout2-ce.png
          APPIMAGE_EXTRACT_AND_RUN=1 OUTPUT=Fallout2-CE-SteamDeck-x86_64.AppImage \
            ./linuxdeploy.AppImage --appdir AppDir --output appimage

      - name: Upload to release
        run: gh release upload "${{ github.event.release.tag_name }}" Fallout2-CE-SteamDeck-x86_64.AppImage --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
